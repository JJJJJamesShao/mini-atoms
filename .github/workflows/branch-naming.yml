name: Branch Naming

# 使用 pull_request_target：workflow 定义取自 base 分支（main），
# PR 作者无法通过修改自己分支里的本文件来绕过校验。
# 该 workflow 不检出 PR 代码、permissions 为空，使用 pull_request_target 是安全的。
on:
  pull_request_target:
    branches: [main]

permissions: {}

jobs:
  check-branch-name:
    name: check-branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch name
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_BRANCH" =~ ^(feat/.+|dev)$ ]]; then
            echo "::error::分支名 '$HEAD_BRANCH' 不符合命名规范：必须以 'feat/' 开头（如 feat/user-login），或使用 dev。"
            exit 1
          fi
          echo "分支名 '$HEAD_BRANCH' 符合规范。"
